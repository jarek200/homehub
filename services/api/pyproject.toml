[project]
name = "homehub-api"
version = "0.1.0"
description = "HomeHub REST API — FastAPI device management"
license = { text = "MIT" }
requires-python = "==3.13.*"
dependencies = [
  "aws-lambda-powertools[tracer]>=3.0.0",
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "mangum>=0.19.0",
  "pydantic>=2.10.0",
  "PyJWT[crypto]>=2.10.0",
  "ulid-py>=1.1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homehub_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
packages = ["homehub_api"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
