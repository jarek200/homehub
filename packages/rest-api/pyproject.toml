[project]
name = "homehub-api"
version = "0.1.0"
description = "HomeHub REST API — FastAPI device management for the interview task"
requires-python = "==3.13.*"
dependencies = [
  "aws-lambda-powertools[tracer]>=3.0.0",
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "mangum>=0.19.0",
  "pydantic>=2.10.0",
  "PyJWT[crypto]>=2.10.0",
  "ulid-py>=1.1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homehub_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
