name: 'Setup Environment'
description: 'Sets up pnpm, Node.js, uv, Python, and installs dependencies'
runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v4.3.0
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'pnpm'
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
