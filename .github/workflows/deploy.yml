name: Deploy

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: deploy-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  setup:
    if: startsWith(github.event.label.name, 'deploy:')
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.parse.outputs.env_name }}
      env_upper: ${{ steps.parse.outputs.env_upper }}
    steps:
      - id: parse
        name: Parse environment from label
        run: |
          LABEL="${{ github.event.label.name }}"
          ENV_NAME="${LABEL#deploy:}"
          ENV_UPPER=$(echo "$ENV_NAME" | tr '[:lower:]' '[:upper:]')
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "env_upper=$ENV_UPPER" >> $GITHUB_OUTPUT

  invalidate-int-stamp:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Clear int deploy stamp after new commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --remove-label "deployed:int" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

  gate:
    needs: setup
    if: needs.setup.outputs.env_name == 'prod'
    runs-on: ubuntu-latest
    permissions:
      deployments: read
      actions: read
      pull-requests: write
    steps:
      - name: Require successful int deploy for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          SHORT_HEAD="${HEAD_SHA:0:7}"

          has_successful_deployment() {
            local sha="$1"
            mapfile -t ids < <(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/deployments?environment=int&sha=${sha}&per_page=100" \
                --jq '.[].id'
            )
            for id in "${ids[@]}"; do
              local state
              state=$(gh api \
                "/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
                --jq '.[0].state')
              if [ "$state" = "success" ]; then
                echo "Found successful int deployment (id ${id}) for ${sha:0:7}."
                return 0
              fi
            done
            return 1
          }

          if has_successful_deployment "$HEAD_SHA" || has_successful_deployment "$MERGE_SHA"; then
            exit 0
          fi

          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json labels --jq -e '.labels[].name | select(. == "deployed:int")' >/dev/null; then
            RUN_ID=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=${HEAD_REF}&event=pull_request&status=success&per_page=20" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${HEAD_SHA}\")][0].id // empty")
            if [ -n "$RUN_ID" ]; then
              echo "Found successful int deploy workflow run ${RUN_ID} for head ${SHORT_HEAD}."
              exit 0
            fi
          fi

          echo "::error::Prod deploy blocked: commit ${SHORT_HEAD} has not been deployed to int. Label this PR with deploy:int first."
          gh pr comment "$PR_NUMBER" \
            --body "Prod deploy blocked: commit \`${SHORT_HEAD}\` has not been deployed to **int**. Add the \`deploy:int\` label and wait for it to succeed, then retry \`deploy:prod\`." \
            --repo "$GITHUB_REPOSITORY"
          gh label create "deploy-blocked:prod" \
            --color "fbca04" \
            --description "Prod deploy blocked — int deploy required first" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --remove-label "deploy:prod" \
            --add-label "deploy-blocked:prod" \
            --repo "$GITHUB_REPOSITORY"
          exit 1

  deploy:
    needs:
      - setup
      - gate
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.setup.outputs.env_name == 'int' || needs.gate.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      deployments: write
    env:
      APP_URL: ${{ vars[format('APP_URL_{0}', needs.setup.outputs.env_upper)] || secrets[format('APP_URL_{0}', needs.setup.outputs.env_upper)] }}
      APPS_HOSTED_ZONE_ID: ${{ vars.APPS_HOSTED_ZONE_ID || secrets.APPS_HOSTED_ZONE_ID }}
      DNS_ROLE_ARN: ${{ secrets.DNS_ROLE_ARN }}
      SST_APP_NAME: ${{ vars.SST_APP_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', needs.setup.outputs.env_upper)] }}
          aws-region: eu-west-1
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages
      - name: Assume cross-account DNS role
        if: env.DNS_ROLE_ARN != ''
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "$DNS_ROLE_ARN" \
            --role-session-name "SSTDnsProvider" \
            --duration-seconds 3600 \
            --output json)
          echo "DNS_AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
          echo "DNS_AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
          echo "DNS_AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"
      - run: pnpm exec sst unlock --stage ${{ needs.setup.outputs.env_name }}
      - run: pnpm exec sst deploy --stage ${{ needs.setup.outputs.env_name }}
      - name: Detect simulator-related changes
        id: simulator
        if: needs.setup.outputs.env_name == 'int' || needs.setup.outputs.env_name == 'prod'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          if git diff --name-only "$BASE" "$HEAD" -- \
            packages/device-simulator \
            scripts/deploy-simulator.sh \
            scripts/ensure-simulator-deployed.sh \
            infra/device-simulator.ts \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Simulator-related files changed — will rebuild and redeploy Lightsail."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No simulator-related changes — Lightsail redeploy only if missing/inactive."
          fi
      - name: Deploy device simulator to Lightsail
        if: needs.setup.outputs.env_name == 'int' || needs.setup.outputs.env_name == 'prod'
        env:
          SST_STAGE: ${{ needs.setup.outputs.env_name }}
          HOMEHUB_FORCE_SIMULATOR_DEPLOY: ${{ steps.simulator.outputs.changed }}
        run: pnpm simulator:deploy
      - name: Mark int deploy complete
        if: success() && needs.setup.outputs.env_name == 'int'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          gh label create "deployed:int" \
            --color "0e8a16" \
            --description "Latest commit on this PR was deployed to int" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --remove-label "deploy:int" \
            --add-label "deployed:int" \
            --repo "$GITHUB_REPOSITORY"

          for sha in "$HEAD_SHA" "$MERGE_SHA"; do
            DEPLOYMENT_ID=$(gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/deployments" \
              -f ref="$sha" \
              -f environment="int" \
              -F auto_merge=false \
              -f description="Int deploy from PR #${PR_NUMBER}" \
              --jq '.id') || continue
            gh api --method POST \
              "/repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
              -f state=success \
              -f description="SST deploy succeeded" || true
          done
      - name: Swap label to error on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ needs.setup.outputs.env_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "deploy-failed:${ENV_NAME}" \
            --color "d73a4a" \
            --description "Deploy to ${ENV_NAME} failed" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --remove-label "deploy:${ENV_NAME}" \
            --add-label "deploy-failed:${ENV_NAME}" \
            --repo "$GITHUB_REPOSITORY"

  merge-to-main:
    name: Merge to main
    needs: [setup, deploy]
    if: needs.setup.outputs.env_name == 'prod' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge PR into main after successful prod deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BASE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')
          if [ "$BASE" != "main" ]; then
            echo "PR #$PR_NUMBER targets '$BASE', not main — skipping auto-merge."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" \
            --merge \
            --repo "$GITHUB_REPOSITORY"
          gh pr edit "$PR_NUMBER" \
            --remove-label "deploy:prod" \
            --remove-label "deploy-blocked:prod" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
