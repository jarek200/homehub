name: Deploy

on:
  pull_request:
    types: [labeled]

concurrency:
  group: deploy-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  setup:
    if: startsWith(github.event.label.name, 'deploy:')
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.parse.outputs.env_name }}
      env_upper: ${{ steps.parse.outputs.env_upper }}
    steps:
      - id: parse
        name: Parse environment from label
        run: |
          LABEL="${{ github.event.label.name }}"
          ENV_NAME="${LABEL#deploy:}"
          ENV_UPPER=$(echo "$ENV_NAME" | tr '[:lower:]' '[:upper:]')
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "env_upper=$ENV_UPPER" >> $GITHUB_OUTPUT

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env_name }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      APP_URL: ${{ vars[format('APP_URL_{0}', needs.setup.outputs.env_upper)] || secrets[format('APP_URL_{0}', needs.setup.outputs.env_upper)] }}
      APPS_HOSTED_ZONE_ID: ${{ vars.APPS_HOSTED_ZONE_ID || secrets.APPS_HOSTED_ZONE_ID }}
      DNS_ROLE_ARN: ${{ secrets.DNS_ROLE_ARN }}
      SST_APP_NAME: ${{ vars.SST_APP_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', needs.setup.outputs.env_upper)] }}
          aws-region: eu-west-1
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Assume cross-account DNS role
        if: env.DNS_ROLE_ARN != ''
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "$DNS_ROLE_ARN" \
            --role-session-name "SSTDnsProvider" \
            --duration-seconds 3600 \
            --output json)
          echo "DNS_AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
          echo "DNS_AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
          echo "DNS_AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"
      - run: pnpm exec sst unlock --stage ${{ needs.setup.outputs.env_name }}
      - run: pnpm exec sst deploy --stage ${{ needs.setup.outputs.env_name }}
      - name: Swap label to error on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ needs.setup.outputs.env_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "deploy-failed:${ENV_NAME}" \
            --color "d73a4a" \
            --description "Deploy to ${ENV_NAME} failed" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --remove-label "deploy:${ENV_NAME}" \
            --add-label "deploy-failed:${ENV_NAME}" \
            --repo "$GITHUB_REPOSITORY"
